spring:
  application:
    name: gateway
  config:
    import: "optional:configserver:http://localhost:8888"
    cloud:
      config:
        fail-fast: true
        retry:
          max-attempts: 6
          initial-interval: 3000
          max-interval: 5000
          multiplier: 1.2
  #Eureka
  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
      fetch-registry: true
      register-with-eureka: true